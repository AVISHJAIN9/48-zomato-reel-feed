name: CI Pipeline

on:
  push:
    branches: [ main, master, docs/repo-completeness ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Structure
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
